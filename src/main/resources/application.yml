spring:
  application:
    name: kim-eduard-student-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/kim_eduard_students}
    username: ${DB_USERNAME:kim_eduard}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
